name: Analisi statica di GreenRoute

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
  workflow_dispatch:
  
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}